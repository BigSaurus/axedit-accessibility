name = axedit-accessibility
summary = "Axe-Edit III Accessibility"
description = """Improves NVDA accessibility for Axe-Edit III (native JUCE app). Speaks slider and combo-box values changed with the arrow keys, fixes the contradictory grid-cell state (block + bypass, no selection chatter), suppresses 169 jack/cable routing-graphic controls, and adds fast 2D grid navigation (arrows, Home/End, Enter to select a block, NVDA+Ctrl+digit to jump to a column on the main row), a jump-to-first-parameter command, section-jump shortcuts, and keyboard activation of mouse-only controls."""
author = "Big Saurus"
url = https://github.com/BigSaurus/axedit-accessibility
version = 0.3.3
docFileName = readme.html
lastTestedNVDAVersion = 2026.1
minimumNVDAVersion = 2022.1
