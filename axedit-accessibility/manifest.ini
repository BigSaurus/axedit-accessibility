name = axedit-accessibility
summary = "Axe-Edit III Accessibility"
description = """Improves NVDA accessibility for Fractal Audio's editors (native JUCE apps). Speaks slider and combo-box values changed with the arrow keys, fixes the contradictory grid-cell state (block + bypass, no selection chatter), makes the mouse-only on/off buttons (Bypass, Scene Ignore, Channel A-D, scenes) operable with Enter without losing focus, keeps focus on a block and speaks its new state instantly when bypassed with Space, suppresses 169 jack/cable routing-graphic controls, and adds fast 2D grid navigation (arrows, Home/End, Enter to select a block, NVDA+Ctrl+digit to jump to a column on the main row), a jump-to-first-parameter command, section-jump shortcuts, opening the top menus with Alt+letter (Alt+P/B/T/S/H), creating cables between blocks from the keyboard (NVDA+Shift+C), announcing preset changes on Ctrl+PageUp/PageDown, speaking the current effect chain (NVDA+Shift+O) and summarising a block's parameters (NVDA+Shift+B), moving between a block's parameter pages (NVDA+Shift+PageDown/PageUp), opening a block's right-click menu with the Applications key, correcting the jump-to-first-parameter target in the Cab block, and keyboard activation of mouse-only controls. Tested with Axe-Edit III; experimental, untested support for FM9-Edit and FM3-Edit is included."""
author = "Big Saurus"
url = https://github.com/BigSaurus/axedit-accessibility
version = 0.10.0
docFileName = readme.html
lastTestedNVDAVersion = 2026.1
minimumNVDAVersion = 2022.1
